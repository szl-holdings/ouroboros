name: Release Please

# Automated changelog + release-PR management via Conventional Commits.
# On every push to main, release-please maintains an open release PR that
# accumulates changes. Merging the release PR creates a GitHub Release and
# semver tag. Downstream jobs (SBOM attachment, signing) can trigger on
# the release event.
#
# Reusable workflow: szl-holdings/.github/.github/workflows/reusable-release-please.yml
# Pinned SHA: 1c5f538ed3b8fe284df98b453d0db94f7a600c41 (verified 2026-05-29)

on:
  push:
    branches: [main]

# Workflow-level permissions must include everything the reusable workflow needs.
# The caller's workflow-level permissions gate what the callee can receive.
permissions:
  contents: write       # release-please creates PRs, tags, releases
  pull-requests: write  # release-please updates the release PR body

jobs:
  release-please:
    uses: szl-holdings/.github/.github/workflows/reusable-release-please.yml@1c5f538ed3b8fe284df98b453d0db94f7a600c41 # v1 (.github main)
    with:
      release-type: node
      package-name: ouroboros
      target-branch: main
    permissions:
      contents: write      # create release PRs and tags
      pull-requests: write # update release PR body
