name: Scorecard

# Removed `branch_protection_rule` trigger — that event runs without commit
# context and causes startup_failure. Schedule + push on main is sufficient
# for OSSF Scorecard to track supply-chain hygiene over time.

on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

# Explicit empty workflow-level permission grant.
#
# Why empty (`{}`) and not omitted: OpenSSF Scorecard's `Token-Permissions`
# check requires a top-level `permissions:` block to be present, otherwise
# the score is reduced (`no topLevel permission defined`). The block must
# be empty here because a non-empty value (including `read-all`) would
# clamp the job-level write scopes the Scorecard job actually needs
# (`security-events: write` and `id-token: write` for SARIF upload + OIDC
# attestation), causing the run to terminate with `startup_failure`.
#
# Empty `{}` satisfies both constraints: the top-level grant is present
# (Scorecard check passes), and the inner ceiling is zero so jobs are
# free to declare their own minimal scopes without being clamped.
permissions: {}

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: szl-holdings/.github/.github/workflows/reusable-scorecard.yml@8186471f7f83f43f3aba4015fcfb2d322dcb4c83 # .github@8186471 fix scorecard permissions
