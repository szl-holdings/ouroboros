# SPDX-License-Identifier: Apache-2.0
# ClusterFuzzLite — PR fuzzing
#
# CURRENTLY DISABLED — see tracking issue.
#
# Status (2026-05-28): ClusterFuzzLite's JavaScript path has an upstream
# config/runtime contradiction. Its config validator rejects
# `sanitizer: none` (only address/memory/undefined/coverage allowed) but
# the OSS-Fuzz JS runtime then rejects ANY sanitizer ("JavaScript projects
# cannot be fuzzed with sanitizers"). Both values fail in CI.
#
# Until ClusterFuzzLite ships a JS-aware sanitizer policy OR we migrate
# to raw Jazzer.js npm scripts, the job is skipped to unblock the merge
# wave. Workflow file kept for restoration when upstream is fixed.
#
# Scorecard "Fuzzing" signal: a follow-up will add a raw Jazzer.js
# harness that runs without ClusterFuzzLite, restoring the signal.
#
# Action SHAs pinned at: 2025-07-15
#   actions/checkout          v4.2.2  → 11bd71901bbe5b1630ceea73d27597364c9af683
#   google/clusterfuzzlite    v1      → 884713a6c30a92e5e8544c39945cd7cb630abcd1

name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [ main ]

permissions: read-all

jobs:
  PR:
    runs-on: ubuntu-latest
    if: false  # See header — ClusterFuzzLite JS path broken upstream; tracking restoration
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10   # v6.0.3

      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1   # v1
        with:
          language: javascript

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1   # v1
        with:
          language: javascript
          fuzz-seconds: 300
          mode: 'code-change'
