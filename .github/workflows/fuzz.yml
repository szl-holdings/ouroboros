# SPDX-License-Identifier: Apache-2.0
name: Fuzz

# Raw Jazzer.js fuzzing for the ouroboros core loop primitives.
#
# Replaces the ClusterFuzzLite path (issue #47): ClusterFuzzLite's JavaScript
# runtime rejects every sanitizer value its own config validator accepts, so
# the CFL GitHub Action cannot run JS fuzzers. This runs Jazzer.js directly --
# no upstream-bug workaround -- on every PR (short budget) and weekly (longer).
# The .clusterfuzzlite/ harness layout is retained so the OpenSSF Scorecard
# "Fuzzing" signal stays positive.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jazzer:
    name: Jazzer.js (loop primitives)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CommonJS fuzz target
        run: |
          pnpm exec tsc -p tsconfig.fuzz.json
          printf '{"type":"commonjs"}\n' > dist-fuzz/package.json
      - name: Run Jazzer.js
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '90' }}
        run: |
          npx --yes -p @jazzer.js/core@2 jazzer \
            .clusterfuzzlite/fuzzers/fuzz_kernel.cjs \
            --sync \
            -- -max_total_time="${FUZZ_SECONDS}" -timeout=25 -rss_limit_mb=4096
      - name: Surface crash inputs (on failure)
        if: failure()
        run: |
          echo "::group::Crash / timeout inputs"
          for f in crash-* timeout-* oom-* ./.clusterfuzzlite/fuzzers/crash-*; do
            [ -e "$f" ] || continue
            echo "----- $f -----"
            (xxd "$f" 2>/dev/null | head -40) || cat "$f" || true
          done
          echo "::endgroup::"
